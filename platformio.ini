; ParallaxSense — PlatformIO project
;
;   Upload gateway : pio run -e gateway -t upload    แล้ว  pio device monitor -e gateway
;   Upload node A  : pio run -e node_a  -t upload    แล้ว  pio device monitor -e node_a
;   Unit tests     : pio test -e native              (รันบนคอม ไม่ต้องมีบอร์ด)
;
; ใน VS Code: เลือก env ที่แถบล่าง (env:gateway / env:node_a) แล้วกดปุ่ม Upload และ Serial Monitor

[platformio]
default_envs = gateway, node_a

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; ถ้าเสียบสองบอร์ดพร้อมกัน ให้ระบุพอร์ตของแต่ละ env เช่น
; upload_port = COM5            (Windows)   หรือ  /dev/cu.usbserial-0001  (macOS)
; monitor_port = COM5

[env:gateway]
extends = esp32_base
build_src_filter = +<gateway/>
lib_deps =
    knolleary/PubSubClient@^2.8

[env:node_a]
extends = esp32_base
build_src_filter = +<node_a/>
build_flags =
    ; เซนเซอร์แสง 3 ขา ต่อขาสัญญาณที่ D34 อ่านแบบ analog 0-100% (ใช้ได้ทั้งโมดูลขา S/AO และ DO)
    ; ยังไม่ได้ต่อ -> LIGHT_ENABLED=0 | เอามือบังแล้วค่ากลับด้าน -> LIGHT_INVERT=1
    ; ถ้าอยากอ่านแบบ digital ที่ขาอื่น -> LIGHT_PIN=19 และ LIGHT_DIGITAL_ONLY=1
    -D LIGHT_ENABLED=1
    -D LIGHT_PIN=34
    -D LIGHT_DIGITAL_ONLY=0
    -D LIGHT_INVERT=0

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I test/stubs
