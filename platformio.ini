; ParallaxSense — PlatformIO project
;
;   Upload gateway : pio run -e gateway -t upload    แล้ว  pio device monitor -e gateway
;   Upload node A  : pio run -e node_a  -t upload    แล้ว  pio device monitor -e node_a
;   Upload node B  : pio run -e node_b  -t upload    แล้ว  pio device monitor -e node_b
;   Unit tests     : pio test -e native              (รันบนคอม ไม่ต้องมีบอร์ด)
;
; ใน VS Code: เลือก env ที่แถบล่าง (env:gateway / env:node_a / env:node_b) แล้วกด Upload และ Serial Monitor

[platformio]
default_envs = gateway, node_a, node_b

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; ถ้าเสียบสองบอร์ดพร้อมกัน ให้ระบุพอร์ตของแต่ละ env เช่น
; upload_port = COM5            (Windows)   หรือ  /dev/cu.usbserial-0001  (macOS)
; monitor_port = COM5

[env:gateway]
extends = esp32_base
build_src_filter = +<gateway/>
lib_deps =
    knolleary/PubSubClient@^2.8

[env:node_a]
extends = esp32_base
build_src_filter = +<node_a/>
build_flags =
    ; เซนเซอร์แสง BH1750 (lux) ต่อ I2C ร่วมกับ MPU6050: SDA D21, SCL D22, VCC 3V3
    ; กลับไปใช้โมดูล LDR 3 ขา -> LIGHT_BH1750=0 และ LIGHT_ENABLED=1 (สัญญาณที่ D34 analog 0-100%)
    ;   เอามือบังแล้วค่ากลับด้าน -> LIGHT_INVERT=1 | อ่านแบบ digital -> LIGHT_PIN=19 และ LIGHT_DIGITAL_ONLY=1
    -D LIGHT_BH1750=1
    -D LIGHT_ENABLED=0
    -D LIGHT_PIN=34
    -D LIGHT_DIGITAL_ONLY=0
    -D LIGHT_INVERT=0
    ; MPU6050 calibrate ตอนบูต + กดปุ่ม BOOT (นั่งตัวตรงก่อน) -> นั่งตรง = pitch/roll 0°
    ; ลองก้มหน้า: roll เปลี่ยนแทน pitch -> IMU_SWAP_PITCH_ROLL=1 | ก้มแล้ว pitch ติดลบ -> IMU_INVERT_PITCH=1
    -D IMU_SWAP_PITCH_ROLL=0
    -D IMU_INVERT_PITCH=0
    -D IMU_INVERT_ROLL=0

[env:node_b]
extends = esp32_base
build_src_filter = +<node_b/>
build_flags =
    ; MPU6050: SDA D21, SCL D22, AD0 GND
    ; Analog FSRs: GPIO32 and GPIO33 (ADC1)
    -D FSR1_PIN=32
    -D FSR2_PIN=33
    -D FSR_FULL_SCALE_MV=3100
    -D FSR_INVERT=0
    -D IMU_SWAP_PITCH_ROLL=0
    -D IMU_INVERT_PITCH=0
    -D IMU_INVERT_ROLL=0

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I test/stubs
